name: Publish signed Android release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/qingya.jks"
          printf '%s' "$PASSWORD" > "$RUNNER_TEMP/qingya-password"
      - name: Build and verify
        env:
          QINGYA_KEYSTORE: ${{ runner.temp }}/qingya.jks
          QINGYA_PASSWORD_FILE: ${{ runner.temp }}/qingya-password
        run: scripts/release.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("artifacts/update.json"))["version"])')
          CODE=$(python3 -c 'import json; print(json.load(open("artifacts/update.json"))["versionCode"])')
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo 'This version already exists. Increase versionName and versionCode.'; exit 1
          fi
          if gh release download --pattern update.json --dir "$RUNNER_TEMP/latest" 2>/dev/null; then
            python3 -c 'import json,sys; assert int(sys.argv[1]) > json.load(open(sys.argv[2]))["versionCode"], "versionCode must increase"' "$CODE" "$RUNNER_TEMP/latest/update.json"
          fi
          gh release create "v$VERSION" "artifacts/qingya-$VERSION.apk" artifacts/update.json artifacts/SHA256SUMS --target "$GITHUB_SHA" --title "青芽 $VERSION" --notes-file docs/release-notes.txt --latest
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/qingya.jks" "$RUNNER_TEMP/qingya-password"
